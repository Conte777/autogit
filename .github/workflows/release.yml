name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The marketplace serves plugins/autogit straight out of this repo, so a
      # manifest that disagrees with the tag hands every `/plugin` user a version
      # number no release ever had. Refuse here, before the cask has moved.
      - name: Plugin version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(jq -r .version plugins/autogit/.claude-plugin/plugin.json)"
          if [ "$got" != "$want" ]; then
            echo "::error::plugin.json says $got, the tag says $want. Bump plugins/autogit/.claude-plugin/plugin.json and re-tag."
            exit 1
          fi
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT with contents:write on Conte777/homebrew-tap.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
