version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: autogit
    main: ./cmd/autogit
    binary: autogit
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - schema/config.schema.json

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  # A re-run of a failed release otherwise dies on its own archives with
  # 422 already_exists, before it ever reaches the cask.
  replace_existing_artifacts: true
  extra_files:
    - glob: schema/config.schema.json

homebrew_casks:
  - name: autogit
    repository:
      owner: Conte777
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/Conte777/autogit
    description: Generate commit messages and ref names with an LLM
    hooks:
      post:
        # The binary is unsigned, so Gatekeeper quarantines it and the first run
        # dies with "developer cannot be verified".
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/autogit"]
          end
