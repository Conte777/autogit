version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: autogit
    main: ./cmd/autogit
    binary: autogit
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - schema/config.schema.json

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  extra_files:
    - glob: schema/config.schema.json

homebrew_casks:
  - name: autogit
    repository:
      owner: Conte777
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/Conte777/autogit
    description: Generate git commit messages and branch names with an LLM
    binary: autogit
